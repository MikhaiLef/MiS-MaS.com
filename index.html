
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MiS-MaS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }

        body.light-theme {
            background: #ffffff;
            color: #000000;
        }

        body.light-theme .chats-screen,
        body.light-theme .chat-screen,
        body.light-theme .chats-list,
        body.light-theme .messages-container,
        body.light-theme .settings-screen {
            background: #ffffff;
        }

        body.light-theme .chats-header,
        body.light-theme .chat-header,
        body.light-theme .settings-header,
        body.light-theme .input-panel,
        body.light-theme .bottom-tabs {
            background: #ffffff;
            border-color: #e5e5ea;
        }

        body.light-theme .chat-name,
        body.light-theme .chat-header-name,
        body.light-theme .settings-header h1,
        body.light-theme .setting-label {
            color: #000000;
        }

        body.light-theme .chat-last-message,
        body.light-theme .chat-time,
        body.light-theme .chat-header-status,
        body.light-theme .setting-description {
            color: #8e8e93;
        }

        body.light-theme .search-bar,
        body.light-theme .input-wrapper,
        body.light-theme .setting-item {
            background: #f2f2f7;
        }

        body.light-theme .message-row.other .bubble {
            background: #e9e9ef;
            color: #000000;
        }

        body.light-theme .chat-content {
            border-color: #e5e5ea;
        }

        body.light-theme .back-button,
        body.light-theme .header-menu,
        body.light-theme .header-icon {
            color: #007aff;
        }

        .app {
            max-width: 100%;
            width: 100%;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000000;
        }

        /* Экран регистрации */
        .register-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        body.light-theme .register-screen {
            background: #ffffff;
        }

        .register-screen.hidden {
            display: none;
        }

        .register-card {
            background: #1c1c1e;
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
        }

        body.light-theme .register-card {
            background: #f2f2f7;
        }

        .register-logo {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .register-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        body.light-theme .register-title {
            color: #000000;
        }

        .register-subtitle {
            font-size: 15px;
            color: #8e8e93;
            margin-bottom: 32px;
        }

        .register-input-wrapper {
            background: #2c2c2e;
            border-radius: 14px;
            padding: 4px 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
        }

        body.light-theme .register-input-wrapper {
            background: #ffffff;
            border: 1px solid #e5e5ea;
        }

        .register-input-wrapper span {
            color: #8e8e93;
            font-size: 20px;
            margin-right: 12px;
        }

        .register-input {
            background: transparent;
            border: none;
            padding: 16px 0;
            color: white;
            font-size: 16px;
            flex: 1;
            outline: none;
        }

        body.light-theme .register-input {
            color: #000000;
        }

        .register-input::placeholder {
            color: #636366;
        }

        .register-hint {
            font-size: 13px;
            color: #8e8e93;
            margin-bottom: 24px;
        }

        .register-btn {
            background: #3390ec;
            border: none;
            border-radius: 14px;
            padding: 16px;
            width: 100%;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .register-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ----- ЭКРАН СПИСКА ЧАТОВ ----- */
        .chats-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000000;
        }

        .chats-screen.hidden {
            display: none;
        }

        .chats-header {
            background: #000000;
            padding: 12px 16px;
            border-bottom: 0.5px solid #1c1c1e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .chats-header h1 {
            font-size: 34px;
            font-weight: 700;
            color: #ffffff;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .header-icon {
            background: none;
            border: none;
            color: #3390ec;
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
        }

        .search-container {
            padding: 8px 16px;
            background: #000000;
        }

        .search-bar {
            background: #1c1c1e;
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-bar span {
            color: #8e8e93;
            font-size: 16px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            flex: 1;
            outline: none;
        }

        body.light-theme .search-bar input {
            color: #000000;
        }

        .search-bar input::placeholder {
            color: #8e8e93;
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            background: #000000;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.15s;
            gap: 12px;
        }

        .chat-item:active {
            background: #1c1c1e;
        }

        body.light-theme .chat-item:active {
            background: #e5e5ea;
        }

        .chat-avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 24px;
        }

        .avatar-main { background: #3390ec; }
        .avatar-fav { background: #ff9f0a; }
        .avatar-bot { background: #af52de; }
        .avatar-private { background: #30b0c0; }

        .chat-content {
            flex: 1;
            min-width: 0;
            padding: 8px 0;
            border-bottom: 0.5px solid #1c1c1e;
        }

        .chat-item:last-child .chat-content {
            border-bottom: none;
        }

        .chat-header-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .chat-name {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .verified-badge {
            color: #3390ec;
            font-size: 14px;
        }

        .chat-time {
            font-size: 13px;
            color: #8e8e93;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .chat-message-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .chat-last-message {
            font-size: 14px;
            color: #8e8e93;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .chat-badge {
            background: #3390ec;
            color: white;
            font-size: 12px;
            font-weight: 600;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            flex-shrink: 0;
        }

        .bottom-tabs {
            background: #000000;
            border-top: 0.5px solid #1c1c1e;
            padding: 8px 16px 0;
            display: flex;
            justify-content: space-around;
        }

        .bottom-tab {
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 12px;
            padding: 8px 0 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            flex: 1;
        }

        .bottom-tab.active {
            color: #3390ec;
        }

        .bottom-tab-icon {
            font-size: 22px;
        }

        /* ----- ЭКРАН ЧАТА ----- */
        .chat-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000000;
        }

        .chat-screen.hidden {
            display: none;
        }

        .chat-header {
            background: #000000;
            padding: 8px 16px;
            border-bottom: 0.5px solid #1c1c1e;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-button {
            background: none;
            border: none;
            color: #3390ec;
            font-size: 28px;
            cursor: pointer;
            padding: 4px 8px 4px 0;
        }

        .chat-header-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .chat-header-text {
            flex: 1;
        }

        .chat-header-name {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chat-header-status {
            font-size: 13px;
            color: #8e8e93;
        }

        .header-menu {
            background: none;
            border: none;
            color: #3390ec;
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px 8px 8px;
            background: #000000;
            display: flex;
            flex-direction: column;
        }

        .messages-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .message-row {
            display: flex;
            margin-bottom: 2px;
        }

        .message-row.own {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
            line-height: 1.4;
            font-size: 15px;
        }

        .message-row.other .bubble {
            background: #1c1c1e;
            border-bottom-left-radius: 6px;
            color: #ffffff;
        }

        .message-row.own .bubble {
            background: #3390ec;
            border-bottom-right-radius: 6px;
            color: white;
        }

        .bubble-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 2px;
            font-size: 12px;
        }

        .message-row.other .bubble-header .name {
            color: #64d2ff;
            font-weight: 600;
        }

        .message-row.own .bubble-header .name {
            color: #a8d4ff;
            font-weight: 600;
        }

        .time {
            font-size: 11px;
            opacity: 0.7;
            margin-left: auto;
        }

        .text-content {
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Стили для изображений в сообщениях */
        .message-image {
            max-width: 100%;
            max-height: 250px;
            border-radius: 12px;
            margin-top: 6px;
            cursor: pointer;
            display: block;
        }

        .message-image.loading {
            opacity: 0.6;
        }

        .image-caption {
            margin-top: 4px;
            font-size: 12px;
            opacity: 0.8;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff5e5e;
            font-size: 12px;
            margin-top: 6px;
            padding: 2px 6px 2px 0;
            cursor: pointer;
            opacity: 0.7;
        }

        .empty-chat {
            text-align: center;
            padding: 50px 20px;
            color: #8e8e93;
            font-size: 14px;
        }

        .input-panel {
            background: #000000;
            border-top: 0.5px solid #1c1c1e;
            padding: 8px 12px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .attach-btn {
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 24px;
            padding: 6px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .attach-btn:hover {
            color: #3390ec;
        }

        .input-wrapper {
            flex: 1;
            background: #1c1c1e;
            border-radius: 20px;
            padding: 6px 8px 6px 16px;
            display: flex;
            align-items: center;
        }

        .input-wrapper textarea {
            background: transparent;
            border: none;
            padding: 6px 0;
            color: #fff;
            font-size: 16px;
            width: 100%;
            outline: none;
            resize: none;
            max-height: 120px;
            font-family: inherit;
            line-height: 1.4;
        }

        body.light-theme .input-wrapper textarea {
            color: #000000;
        }

        .input-wrapper textarea::placeholder {
            color: #636366;
        }

        .send-btn {
            background: #3390ec;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 20px;
            flex-shrink: 0;
        }

        .send-btn:disabled {
            opacity: 0.5;
        }

        /* Превью изображения перед отправкой */
        .image-preview-container {
            padding: 8px 12px;
            background: #000000;
            border-top: 0.5px solid #1c1c1e;
        }

        body.light-theme .image-preview-container {
            background: #ffffff;
            border-color: #e5e5ea;
        }

        .image-preview {
            position: relative;
            display: inline-block;
            max-width: 150px;
        }

        .image-preview img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            max-height: 100px;
            object-fit: cover;
        }

        .remove-preview-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff5e5e;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Просмотр изображения на весь экран */
        .image-viewer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .image-viewer-overlay img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }

        .close-viewer {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 32px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 10px;
        }

        /* ----- ЭКРАН НАСТРОЕК ----- */
        .settings-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000000;
        }

        .settings-screen.hidden {
            display: none;
        }

        .settings-header {
            background: #000000;
            padding: 12px 16px;
            border-bottom: 0.5px solid #1c1c1e;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .settings-header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
        }

        .settings-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .settings-section {
            margin-bottom: 24px;
        }

        .settings-section-title {
            font-size: 13px;
            color: #8e8e93;
            text-transform: uppercase;
            margin-bottom: 8px;
            padding-left: 8px;
        }

        .setting-item {
            background: #1c1c1e;
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1px;
            cursor: pointer;
        }

        body.light-theme .setting-item {
            background: #f2f2f7;
        }

        .setting-item:active {
